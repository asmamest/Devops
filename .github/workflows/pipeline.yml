name: CI/CD Pipeline

# Trigger the pipeline on push to the main branch
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # JOB 1: Test and Security Scan
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install bandit

      - name: Run Security Scan (SAST)
        # -r app/: Recursive scan of app folder
        # -s B101: Skip rule B101 (assert statements used in tests)
        run: bandit -r app/ -s B101

      - name: Run Unit Tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/

  # JOB 2: Build and Push Docker Image
  build-and-push:
    needs: test-and-security # Only run if tests pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/simple-todo-app:latest

  # JOB 3: DAST Security Scan
  dast-scan:
    needs: build-and-push # Only run after Docker image is built
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Pull Docker Image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/simple-todo-app:latest

      - name: Start Application Container
        run: |
          docker run -d -p 8000:8000 --name todo-api \
            ${{ secrets.DOCKER_USERNAME }}/simple-todo-app:latest
          sleep 10

      - name: Verify Application is Running
        run: curl -f http://localhost:8000 || exit 1

      - name: Run OWASP ZAP Baseline Scan (DAST)
        run: |
          docker run -v $(pwd):/zap/wrk/:rw -t zaproxy/zap-stable \
            zap-baseline.py -t http://172.17.0.1:8000 \
            -r zap-report.html -I

      - name: Upload ZAP Security Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-report
          path: zap-report.html

      - name: Stop Application Container
        if: always()
        run: |
          docker stop todo-api
          docker rm todo-api
